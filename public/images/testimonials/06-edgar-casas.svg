  <text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" fill="#18344f"><tspan x="64" y="168">Rodrigo, un caballero. Muy buen</tspan><tspan x="64" y="208">trabajo y siempre aportó más de lo</tspan><tspan x="64" y="248">que se solicitó. Capo en su tema.</tspan></text>
