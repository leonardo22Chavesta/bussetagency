<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img">
  <rect width="720" height="520" fill="#ffffff"/>
  <rect x="0" y="0" width="720" height="8" fill="#c6a570"/>
  <text font-family="Georgia, Times New Roman, serif" font-size="72" fill="#eadcc4" x="56" y="150">“</text>
  <text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" fill="#18344f"><tspan x="64" y="168">Teníamos muchas ideas, pero no</tspan><tspan x="64" y="208">sabíamos cómo aterrizarlas ni cómo</tspan><tspan x="64" y="248">hacer que los anuncios</tspan><tspan x="64" y="288">funcionaran. Desde la primera</tspan><tspan x="64" y="328">llamada tuvimos total claridad.</tspan><tspan x="64" y="368">Sin haber terminado siquiera la</tspan><tspan x="64" y="408">campaña, ya recuperamos toda la</tspan><tspan x="64" y="448">inversión y seguimos sumando</tspan><tspan x="64" y="488">alumnas nuevas.</tspan></text>
</svg>