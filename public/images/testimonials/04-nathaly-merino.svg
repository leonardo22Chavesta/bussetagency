  <text font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" fill="#18344f"><tspan x="64" y="168">Antes los resultados eran lentos y</tspan><tspan x="64" y="208">costosos. Con Rodrigo fueron</tspan><tspan x="64" y="248">rápidos y visibles desde el</tspan><tspan x="64" y="288">inicio. Crecimos en seguidores,</tspan><tspan x="64" y="328">llegaron más pacientes por redes y</tspan><tspan x="64" y="368">varios videos se hicieron virales,</tspan><tspan x="64" y="408">superando las 500.000 vistas. En</tspan><tspan x="64" y="448">TikTok pasamos de 0 a más de 5.100</tspan><tspan x="64" y="488">seguidores.</tspan></text>
